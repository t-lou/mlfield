[tool.ruff]
target-version = "py312"
line-length = 120
src = ["components", "experiments", "tools"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C90", # mccabe
]
ignore = [
    "E501",  # formatter handles long lines
    "B905",  # zip without strict param is sometimes intentional in data pipelines
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["components", "experiments", "tools"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true
ignore_missing_imports = true

[tool.pyright]
include = ["components", "experiments", "tools"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = false
reportUnknownMemberType = false
